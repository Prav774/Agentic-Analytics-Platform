spring.application.name=crm-postgresql-mcp-server
server.port=${CRM_MCP_PORT:8081}
server.address=127.0.0.1
spring.ai.mcp.server.protocol=STREAMABLE

spring.datasource.url=${CRM_DB_URL:jdbc:postgresql://localhost:5432/enterprise_crm}
spring.datasource.username=${CRM_DB_USERNAME:crm_reader}
spring.datasource.password=${CRM_DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
analytics.query.timeout-seconds=${MCP_QUERY_TIMEOUT_SECONDS:10}
analytics.query.max-rows=${MCP_QUERY_MAX_ROWS:500}
