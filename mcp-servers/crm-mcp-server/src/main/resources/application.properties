spring.application.name=crm-postgresql-mcp-server
server.port=${CRM_MCP_PORT:8081}
spring.ai.mcp.server.protocol=STREAMABLE

spring.datasource.url=${CRM_DB_URL}
spring.datasource.username=${CRM_DB_USERNAME}
spring.datasource.password=${CRM_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
