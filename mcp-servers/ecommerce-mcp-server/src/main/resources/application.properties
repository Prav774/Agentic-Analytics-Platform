spring.application.name=ecommerce-mysql-mcp-server
server.port=${ECOMMERCE_MCP_PORT:8082}
spring.ai.mcp.server.protocol=STREAMABLE

spring.datasource.url=${ECOMMERCE_DB_URL}
spring.datasource.username=${ECOMMERCE_DB_USERNAME}
spring.datasource.password=${ECOMMERCE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
