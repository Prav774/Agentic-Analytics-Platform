spring.application.name=ecommerce-mysql-mcp-server
server.port=${ECOMMERCE_MCP_PORT:8082}
server.address=127.0.0.1
spring.ai.mcp.server.protocol=STREAMABLE

spring.datasource.url=${ECOMMERCE_DB_URL:jdbc:mysql://localhost:3306/enterprise_ecommerce}
spring.datasource.username=${ECOMMERCE_DB_USERNAME:ecommerce_reader}
spring.datasource.password=${ECOMMERCE_DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
analytics.query.timeout-seconds=${MCP_QUERY_TIMEOUT_SECONDS:10}
analytics.query.max-rows=${MCP_QUERY_MAX_ROWS:500}
