spring.application.name=agentic-analytics-backend
server.port=8080

# Authentication Database (PostgreSQL - dedicated auth schema)
spring.datasource.url=jdbc:postgresql://localhost:5432/enterprise_crm?currentSchema=auth
spring.datasource.username=auth_user
spring.datasource.password=auth_password_1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=auth

# Security & JWT Configuration
security.jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
security.jwt.expiration-ms=86400000
security.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# MCP server connections
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.streamable-http.connections.crm.url=http://127.0.0.1:8081
spring.ai.mcp.client.streamable-http.connections.crm.endpoint=/mcp
spring.ai.mcp.client.streamable-http.connections.ecommerce.url=http://127.0.0.1:8082
spring.ai.mcp.client.streamable-http.connections.ecommerce.endpoint=/mcp

# Groq OpenAI-compatible LLM Configuration
spring.ai.openai.api-key=test-groq-api-key-for-unit-tests
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.1
