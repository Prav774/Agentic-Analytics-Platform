spring.application.name=agentic-analytics-backend
server.port=${API_PORT:8080}

# MCP server connections use the official Streamable HTTP transport.
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.streamable-http.connections.crm.url=${CRM_MCP_URL:http://127.0.0.1:8081}
spring.ai.mcp.client.streamable-http.connections.crm.endpoint=/mcp
spring.ai.mcp.client.streamable-http.connections.ecommerce.url=${ECOMMERCE_MCP_URL:http://127.0.0.1:8082}
spring.ai.mcp.client.streamable-http.connections.ecommerce.endpoint=/mcp

# Groq OpenAI-compatible LLM Configuration
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.chat.model=${GROQ_MODEL:llama-3.3-70b-versatile}
spring.ai.openai.chat.options.model=${GROQ_MODEL:llama-3.3-70b-versatile}
spring.ai.openai.chat.options.temperature=0.1
