spring.application.name=agentic-analytics-backend
server.port=${API_PORT:8080}

# Authentication Database (PostgreSQL - dedicated auth schema)
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/enterprise_crm?currentSchema=auth}
spring.datasource.username=${AUTH_DB_USERNAME:auth_user}
spring.datasource.password=${AUTH_DB_PASSWORD:auth_password_1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=auth

# Security & JWT Configuration
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info

# MCP server connections use the official Streamable HTTP transport.
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.streamable-http.connections.crm.url=${CRM_MCP_URL:http://127.0.0.1:8081}
spring.ai.mcp.client.streamable-http.connections.crm.endpoint=/mcp
spring.ai.mcp.client.streamable-http.connections.ecommerce.url=${ECOMMERCE_MCP_URL:http://127.0.0.1:8082}
spring.ai.mcp.client.streamable-http.connections.ecommerce.endpoint=/mcp

# Groq OpenAI-compatible LLM Configuration
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.chat.model=${GROQ_MODEL:llama-3.3-70b-versatile}
spring.ai.openai.chat.options.model=${GROQ_MODEL:llama-3.3-70b-versatile}
spring.ai.openai.chat.options.temperature=0.1
